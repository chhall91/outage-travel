name: Refresh NRC status & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 13 * * *'   # daily, after NRC posts the morning report
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh NRC reactor status snapshot
        continue-on-error: true
        run: CHROME=$(which google-chrome || which chromium) node scripts/fetch-status.mjs
      - name: Commit snapshot if it changed
        continue-on-error: true
        run: |
          if ! git diff --quiet public/reactor-status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add public/reactor-status.json
            git commit -m "NRC reactor status snapshot $(date -u +%F) [skip ci]"
            git push
          fi
      - run: npm test
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
